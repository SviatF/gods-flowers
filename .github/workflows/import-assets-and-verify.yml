name: Full Next.js migration

on:
  push:
    branches: ["full-nextjs-ssr-migration"]

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize rewritten Next.js project
        shell: bash
        run: |
          rm -rf app components scripts public/assets
          rm -f package.json package-lock.json tsconfig.json next-env.d.ts next.config.ts README.md .gitignore
          base64 -d .github/bootstrap/project.tgz.b64 > /tmp/gods-flowers-project.tgz
          tar -xzf /tmp/gods-flowers-project.tgz -C .

      - name: Fetch exact original assets locally
        run: npm run fetch:assets

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production SSR build
        run: npm run build

      - name: Commit complete autonomous migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- . ':!.github/bootstrap/project.tgz.b64'
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Complete autonomous Next.js SSR migration"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Migration already materialized and build passed."
          fi
