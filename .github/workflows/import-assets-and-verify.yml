name: Full Next.js migration

on:
  push:
    branches: ["full-nextjs-ssr-migration"]

permissions:
  contents: write

jobs:
  vendor-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Vendor exact original assets
        run: npm run fetch:assets

      - name: Verify production SSR build
        run: npm run build

      - name: Commit vendored assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/assets package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Vendor all site assets after verified build"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Assets already vendored and build passed."
          fi
