name: Install exact logo

on:
  push:
    paths:
      - '.logo-upload-ready'

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact PNG bytes
        run: |
          cat .logo-upload/chunk_* > /tmp/logo.b64
          base64 -d /tmp/logo.b64 > public/gods-flowers-logo.png
          file public/gods-flowers-logo.png
          test "$(stat -c%s public/gods-flowers-logo.png)" = "576441"
      - name: Commit exact PNG and remove temporary uploader files
        run: |
          rm -rf .logo-upload .logo-upload-ready .github/workflows/install-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace broken logo with exact original PNG"
          git push
